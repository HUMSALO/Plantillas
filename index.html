<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>REGISTRO DE INCIDENTE</title>

<!-- Librerías Externas -->
<script src="https://unpkg.com/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.2/cropper.min.css">

<style>
/* ===== ESTILOS BASE Y VARIABLES ===== */
:root {
    --primary: #444;
    --whatsapp: #25d366;
    --gps: #1976d2;
    --limpiar: #777;
    --borrar: #b00020;
    --modificar: #ff8f00;
    --escaner: #673ab7;
    --forms: #ff9800;
    --trabajo: #e91e63;
    --mapa: #00897b;
    --revertir: #ffc107;
}

body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    padding: 10px;
    text-transform: uppercase;
}

.contenedor {
    max-width: 450px;
    margin: auto;
    background: white;
    padding: 12px;
    border-radius: 10px;
}

h1 {
    text-align: center;
    font-size: 20px;
}

label {
    font-weight: bold;
    display: block;
    margin-top: 8px;
}

input, select, textarea {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    font-size: 14px;
    border-radius: 6px;
    border: 1px solid #aaa;
    box-sizing: border-box;
    text-transform: uppercase;
}

input#claveOficial, input#linkForms {
    text-transform: none !important;
}

textarea {
    height: 120px;
}

button {
    width: 100%;
    padding: 10px;
    margin-top: 8px;
    border: 0;
    border-radius: 7px;
    font-size: 15px;
    text-transform: uppercase;
    cursor: pointer;
}

/* ===== CLASES DE BOTONES ===== */
.datos { background: var(--primary); color: white; }
.whatsapp { background: var(--whatsapp); color: white; }
.gps { background: var(--gps); color: white; }
.limpiar { background: var(--limpiar); color: white; }
.borrar { background: var(--borrar); color: white; }
.modificar { background: var(--modificar); color: white; }
.escaner { background: var(--escaner); color: white; }
.forms { background: var(--forms); color: white; }
.trabajo { background: var(--trabajo); color: white; }
.btn-mapa { background: var(--mapa); color: white; width: 40px; height: 35px; border-radius: 6px; font-size: 16px; margin-top: 4px; border: 0; }
.btn-revertir { background: var(--revertir); color: #333; display: none; }

.oculto { display: none; }

/* ===== COMPONENTES UI COMUNES ===== */
.combo-wrapper {
    position: relative;
    width: 100%;
    margin-top: 4px;
}

.combo { 
    display: flex; 
    width: 100%;
}
.combo input { 
    flex: 1; 
    border-radius: 6px 0 0 6px;
    margin: 0;
}
.combo button { 
    width: 40px; 
    border-radius: 0 6px 6px 0; 
    background: #ddd; 
    color: #000;
    margin: 0;
    padding: 8px;
    border: 1px solid #aaa;
    border-left: none;
}

/* Grupo especial para cantidad con botones + y - */
.combo-cantidad {
    display: flex;
    width: 100%;
    gap: 0;
}
.combo-cantidad input {
    flex: 1;
    border-radius: 6px 0 0 6px;
    margin: 0;
    border-right: none;
}
.combo-cantidad .btn-cant-op {
    width: 35px;
    background: #e0e0e0;
    color: #000;
    margin: 0;
    padding: 0;
    border: 1px solid #aaa;
    border-radius: 0;
    font-weight: bold;
    font-size: 16px;
}
.combo-cantidad button.btn-dropdown-cant {
    width: 40px;
    border-radius: 0 6px 6px 0;
    background: #ddd;
    color: #000;
    margin: 0;
    padding: 8px;
    border: 1px solid #aaa;
    border-left: none;
}

.lista {
    display: none;
    border: 1px solid #aaa;
    border-top: none;
    border-radius: 0 0 6px 6px;
    background: white;
    position: absolute;
    z-index: 1000;
    width: 100%;
    top: calc(100% - 1px);
    left: 0;
    box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    max-height: 200px;
    overflow-y: auto;
}

.lista.mostrar {
    display: block;
}

.lista div { 
    padding: 10px 8px; 
    border-bottom: 1px solid #eee;
    cursor: pointer;
    white-space: normal;
    word-break: break-word;
    font-size: 14px;
    text-transform: uppercase;
}
.lista div:hover { background: #f0f0f0; }
.lista div:last-child { border-bottom: none; }

/* ===== ESCANER ===== */
.zonaEscaner { width: 100%; height: 250px; overflow: hidden; background: #ddd; border-radius: 6px; margin-top: 8px; position: relative; }
.zonaEscaner img { max-width: 100%; display: block; }
.linea { display: flex; gap: 5px; }
.linea button { flex: 1; }

/* ===== PLANTILLAS FORMS & OTROS ===== */
.box { background: white; max-width: 400px; margin: auto; padding: 15px; border-radius: 10px; }
.campo { margin-top: 12px; }
.nacionalidad { display: flex; gap: 5px; }
.nacionalidad input { flex: 1; }
.nacionalidad select { width: 130px; }
.botones { display: flex; gap: 5px; margin-top: 4px; }
.botones button { flex: 1; height: 35px; padding: 0 5px; margin: 0; font-size: 13px; border: 1px solid #777; background: #eee; color: black; border-radius: 5px; }
.botones button.btn-copiar { background: #e0e0e0; }

.grupo-lugar { display: flex; gap: 5px; align-items: center; }
.grupo-lugar input { flex: 1; }

.fila-fecha-hora { display: flex; gap: 5px; margin-top: 4px; }
.fila-fecha-hora input[type="date"] { flex: 2; margin-top: 0; }
.fila-fecha-hora input[type="time"] { flex: 1; margin-top: 0; }

/* ===== LISTA DE DROGAS GUARDADAS EN INCIDENTE ===== */
.listaGuardados { border: 1px solid #ccc; border-radius: 6px; margin-top: 8px; max-height: 220px; overflow-y: auto; background: #fafafa; }
.listaGuardados .itemGuardado { padding: 8px; border-bottom: 1px solid #e0e0e0; font-size: 13px; cursor: pointer; }
.listaGuardados .itemGuardado:last-child { border-bottom: none; }
.listaGuardados .itemGuardado:hover { background: #eee; }
.listaGuardados .vacio { padding: 10px; text-align: center; color: #888; font-size: 13px; cursor: default; }
.filaBotonesDroga { display: flex; gap: 5px; margin-top: 12px; }
.filaBotonesDroga button { flex: 1; margin: 0; }

/* Lista interactiva para selección y eliminación en Trabajo Diario */
.listaTrabajoSeleccionable { border: 1px solid #aaa; border-radius: 6px; max-height: 200px; overflow-y: auto; background: #fafafa; margin-top: 4px; padding: 4px; }
.listaTrabajoSeleccionable .itemTrabajo { padding: 6px 8px; border-bottom: 1px solid #eee; font-size: 13px; cursor: pointer; user-select: none; }
.listaTrabajoSeleccionable .itemTrabajo:hover { background: #f0f0f0; }
.listaTrabajoSeleccionable .itemTrabajo.seleccionado { background: #d0e8ff; border-color: #99c2ff; }
</style>
</head>

<body>
<div class="contenedor">

<!-- MENÚ DE NAVEGACIÓN PRINCIPAL -->
<button class="trabajo" onclick="App.UI.mostrar('moduloTrabajoDiario')">📊 TRABAJO DIARIO</button>
<button class="datos" onclick="App.UI.mostrar('moduloDatos')">⚙️ DATOS</button>
<button class="datos" onclick="App.UI.mostrar('moduloDrogas')">📋 REGISTRO DE INCIDENTE</button>
<button class="datos" onclick="App.UI.mostrar('moduloPlantilla')">⚖️ PLANTILLA APREHENSIONES</button>

<!-- ================= MÓDULO DATOS ================= -->
<div id="moduloDatos" class="oculto">
    <h1>⚙️ DATOS</h1>
    
    <h3>👮 OFICIALES</h3>
    <input id="nuevoOficial" placeholder="NOMBRE OFICIAL" oninput="this.value=this.value.toUpperCase()">
    <input id="cedulaOficial" placeholder="CÉDULA" oninput="this.value=this.value.toUpperCase()">
    <input id="claveOficial" placeholder="CONTRASEÑA:">
    <select id="listaOficiales" onchange="App.Modulos.Datos.seleccionarOficial()"></select>
    <button id="btnAgregarOficial" onclick="App.Modulos.Datos.guardarOficial()">➕ GUARDAR OFICIAL</button>
    <button id="btnModificarOficial" class="modificar oculto" onclick="App.Modulos.Datos.modificarOficial()">✏️ MODIFICAR OFICIAL SELECCIONADO</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarOficial()">❌ BORRAR OFICIAL SELECCIONADO</button>
    <button id="btnRevertirOficial" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('oficiales')">REVERTIR ESTO</button>

    <h3>🧪 DROGAS</h3>
    <input id="nuevaDroga" placeholder="TIPO DROGA" oninput="this.value=this.value.toUpperCase()">
    <select id="listaDrogas" onchange="App.Modulos.Datos.seleccionarDroga()"></select>
    <button id="btnAgregarDroga" onclick="App.Modulos.Datos.guardarDroga()">➕ GUARDAR DROGA</button>
    <button id="btnModificarDroga" class="modificar oculto" onclick="App.Modulos.Datos.modificarDroga()">✏️ MODIFICAR DROGA SELECCIONADA</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarDroga()">❌ BORRAR DROGA SELECCIONADA</button>
    <button id="btnRevertirDroga" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('drogas')">REVERTIR ESTO</button>

    <h3>📦 PRESENTACIONES</h3>
    <select id="listaDrogasPresentacion" onchange="App.Modulos.Datos.cambiarDrogaPresentacion()"></select>
    <select id="listaPresentaciones" onchange="App.Modulos.Datos.seleccionarPresentacion()"></select>
    <input id="nuevaPresentacion" placeholder="PRESENTACIÓN" oninput="this.value=this.value.toUpperCase()">
    <button id="btnAgregarPresentacion" onclick="App.Modulos.Datos.guardarPresentacion()">➕ GUARDAR PRESENTACIÓN</button>
    <button id="btnModificarPresentacion" class="modificar oculto" onclick="App.Modulos.Datos.modificarPresentacion()">✏️ MODIFICAR PRESENTACIÓN SELECCIONADA</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarPresentacion()">❌ BORRAR PRESENTACIÓN SELECCIONADA</button>
    <button id="btnRevertirPresentacion" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('presentaciones')">REVERTIR ESTO</button>

    <h3>⚖️ TIPO DE PLANTILLA</h3>
    <input id="nuevoTipoPlantilla" placeholder="TIPO PLANTILLA" oninput="this.value=this.value.toUpperCase()">
    <select id="listaTiposPlantilla" onchange="App.Modulos.Datos.seleccionarTipoPlantilla()"></select>
    <button id="btnAgregarTipoPlantilla" onclick="App.Modulos.Datos.guardarTipoPlantilla()">➕ GUARDAR TIPO</button>
    <button id="btnModificarTipoPlantilla" class="modificar oculto" onclick="App.Modulos.Datos.modificarTipoPlantilla()">✏️ MODIFICAR TIPO SELECCIONADO</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarTipoPlantilla()">❌ BORRAR TIPO SELECCIONADO</button>
    <button id="btnRevertirTipoPlantilla" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('tiposPlantilla')">REVERTIR ESTO</button>

    <h3>⚖️ TIPO DE DELITO</h3>
    <select id="listaTiposPlantillaDelito" onchange="App.Modulos.Datos.cambiarTipoPlantillaDelito()"></select>
    <select id="listaDelitos" onchange="App.Modulos.Datos.seleccionarDelito()"></select>
    <input id="nuevoDelito" placeholder="TIPO DELITO" oninput="this.value=this.value.toUpperCase()">
    <button id="btnAgregarDelito" onclick="App.Modulos.Datos.guardarDelito()">➕ GUARDAR DELITO</button>
    <button id="btnModificarDelito" class="modificar oculto" onclick="App.Modulos.Datos.modificarDelito()">✏️ MODIFICAR DELITO SELECCIONADO</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarDelito()">❌ BORRAR DELITO SELECCIONADA</button>
    <button id="btnRevertirDelito" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('delitosPlantilla')">REVERTIR ESTO</button>

    <h3>🚔 UNIDADES</h3>
    <input id="nuevaUnidad" placeholder="UNIDAD" oninput="this.value=this.value.toUpperCase()">
    <select id="listaUnidades" onchange="App.Modulos.Datos.seleccionarUnidad()"></select>
    <button id="btnAgregarUnidad" onclick="App.Modulos.Datos.guardarUnidad()">➕ GUARDAR UNIDAD</button>
    <button id="btnModificarUnidad" class="modificar oculto" onclick="App.Modulos.Datos.modificarUnidad()">✏️ MODIFICAR UNIDAD SELECCIONADA</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarUnidad()">❌ BORRAR UNIDAD SELECCIONADA</button>
    <button id="btnRevertirUnidad" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('unidades')">REVERTIR ESTO</button>

    <h3>👥 GRUPO</h3>
    <input id="nuevoGrupo" placeholder="GRUPO" oninput="this.value=this.value.toUpperCase()">
    <select id="listaGrupo" onchange="App.Modulos.Datos.seleccionarGrupo()"></select>
    <button id="btnAgregarGrupo" onclick="App.Modulos.Datos.guardarGrupo()">➕ GUARDAR GRUPO</button>
    <button id="btnModificarGrupo" class="modificar oculto" onclick="App.Modulos.Datos.modificarGrupo()">✏️ MODIFICAR GRUPO SELECCIONADO</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarGrupo()">❌ BORRAR GRUPO SELECCIONADO</button>
    <button id="btnRevertirGrupo" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('grupos')">REVERTIR ESTO</button>

    <h3>📝 LINK FORMS OFFICE</h3>
    <input id="linkForms" placeholder="PEGAR LINK FORMS OFFICE">
    <select id="linkFormsSelect" onchange="App.Modulos.Datos.seleccionarForms()">
        <option>SELECCIONAR</option>
    </select>
    <button id="btnAgregarForms" class="forms" onclick="App.Modulos.Datos.guardarForms()">💾 GUARDAR LINK</button>
    <button id="btnModificarForms" class="modificar oculto" onclick="App.Modulos.Datos.modificarForms()">✏️ MODIFICAR LINK SELECCIONADO</button>
    <button class="borrar" onclick="App.Modulos.Datos.borrarForms()">❌ BORRAR LINK SELECCIONADO</button>
    <button id="btnRevertirForms" class="btn-revertir" onclick="App.Modulos.Datos.revertirCambio('formsList')">REVERTIR ESTO</button>
</div>

<!-- ================= REGISTRO DE INCIDENTE ================= -->
<div id="moduloDrogas" class="oculto">
    <h1>📋 REGISTRO DE INCIDENTE</h1>
    <label>FECHA</label>
    <input type="date" id="fecha">
    <label>HORA</label>
    <input type="time" id="hora">
    <label>LUGAR DEL DECOMISO</label>
    <div class="grupo-lugar">
        <input id="lugar" oninput="this.value=this.value.toUpperCase()">
        <button class="btn-mapa" onclick="App.Utilidades.abrirMapa('lugar')" title="VER EN GOOGLE MAPS">🗺️</button>
    </div>
    <button class="gps" onclick="App.Utilidades.obtenerGPS('lugar')">📍 CARGAR LUGAR</button>

    <label>TIPO DE DROGA</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="droga" oninput="this.value=this.value.toUpperCase(); App.Modulos.Incidente.actualizarPresentacionDinamica();">
            <button onclick="App.UI.toggleLista('listaDrogasUso')">▼</button>
        </div>
        <div id="listaDrogasUso" class="lista"></div>
    </div>

    <label>PRESENTACIÓN</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="presentacion" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaPresentacionUso')">▼</button>
        </div>
        <div id="listaPresentacionUso" class="lista"></div>
    </div>

    <label>CANTIDAD</label>
    <div class="combo-wrapper">
        <div class="combo-cantidad">
            <button type="button" class="btn-cant-op" onclick="App.Modulos.Incidente.cambiarCantidadValor(-1)">-</button>
            <input id="cantidadNum" oninput="this.value=this.value.toUpperCase(); App.Modulos.Incidente.actualizarPresentacionDinamica();">
            <button type="button" class="btn-cant-op" onclick="App.Modulos.Incidente.cambiarCantidadValor(1)">+</button>
            <button type="button" class="btn-dropdown-cant" onclick="App.UI.toggleLista('listaCantidadNum')">▼</button>
        </div>
        <div id="listaCantidadNum" class="lista"></div>
    </div>
    <input type="hidden" id="cantidad">

    <div class="filaBotonesDroga">
        <button class="whatsapp" id="btnGuardarDroga" onclick="App.Modulos.Incidente.guardarDroga()">💾 GUARDAR</button>
        <button class="limpiar" id="btnLimpiarDroga" onclick="App.Modulos.Incidente.limpiarCamposDroga()">🧹 LIMPIAR</button>
        <button class="borrar oculto" id="btnEliminarDroga" onclick="App.Modulos.Incidente.eliminarDroga()">❌ ELIMINAR</button>
    </div>
    <div id="listaDrogasGuardadas" class="listaGuardados"></div>

    <button id="btnEscanerIncidente" class="escaner" onclick="App.Escaner.abrir('incidente')">📷 ESCANEAR DATOS</button>

    <label>NOMBRE IMPUTADO</label>
    <input id="nombre" oninput="this.value=this.value.toUpperCase()">
    <label>CEDULA IMPUTADO</label>
    <input id="cedula" oninput="this.value=this.value.toUpperCase()">
    <input type="hidden" id="fechaNacimientoIncidente">

    <label>👮 OFICIAL ACTUANTE</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="oficialActuante" placeholder="SELECCIONAR" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaActuante')">▼</button>
        </div>
        <div id="listaActuante" class="lista"></div>
    </div>

    <label>👮 OFICIAL ASISTENTE</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="oficialAsistente" placeholder="SELECCIONAR" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaAsistente')">▼</button>
        </div>
        <div id="listaAsistente" class="lista"></div>
    </div>

    <button class="whatsapp" onclick="App.Modulos.Incidente.enviarWhatsApp()">💬 ENVIAR WHATSAPP</button>
    <button class="forms" onclick="App.Modulos.Forms.abrir('incidente')">📝 LLENADO LINK</button>
    <button class="limpiar" onclick="window.scrollTo({top:0, behavior:'smooth'}); App.Modulos.Incidente.limpiar()">🧹 LIMPIAR TODO</button>
</div>

<!-- ================= PLANTILLA APREHENSIONES ================= -->
<div id="moduloPlantilla" class="oculto">
    <h1>⚖️ PLANTILLA APREHENSIONES</h1>
    <label>TIPO DE PLANTILLA</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="tipoPlantilla" placeholder="SELECCIONAR" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaTipo')">▼</button>
        </div>
        <div id="listaTipo" class="lista"></div>
    </div>

    <label>TIPO DELITO</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="delitoPlantilla" placeholder="SELECCIONAR" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaDelitoPlantilla')">▼</button>
        </div>
        <div id="listaDelitoPlantilla" class="lista"></div>
    </div>

    <label>FECHA</label>
    <input type="date" id="fechaPlantilla">
    <label>HORA</label>
    <input type="time" id="horaPlantilla">
    <label>CANTÓN</label>
    <input id="canton" value="SAN JOSÉ" oninput="this.value=this.value.toUpperCase()">
    <label>DISTRITO</label>
    <input id="distrito" value="SAN JOSÉ" oninput="this.value=this.value.toUpperCase()">

    <label>LUGAR EXACTO</label>
    <div class="grupo-lugar">
        <input id="lugarPlantilla" oninput="this.value=this.value.toUpperCase()">
        <button class="btn-mapa" onclick="App.Utilidades.abrirMapa('lugarPlantilla')" title="VER EN GOOGLE MAPS">🗺️</button>
    </div>
    <button class="gps" onclick="App.Utilidades.obtenerGPS('lugarPlantilla')">📍 CARGAR LUGAR</button>

    <button id="btnEscanerAprehension" class="escaner" onclick="App.Escaner.abrir('aprehension')">📷 ESCANEAR DATOS</button>

    <label>NOMBRE IMPUTADO</label>
    <input id="nombrePlantilla" oninput="this.value=this.value.toUpperCase()">
    <label>CÉDULA</label>
    <input id="cedulaPlantilla" oninput="this.value=this.value.toUpperCase()">
    <input type="hidden" id="fechaNacimientoPlantilla">

    <label>NACIONALIDAD</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="nacionalidadPlantilla" placeholder="SELECCIONAR" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaNacionalidadPlantilla')">▼</button>
        </div>
        <div id="listaNacionalidadPlantilla" class="lista"></div>
    </div>

    <label>EXPEDIENTE</label>
    <input id="expediente" oninput="this.value=this.value.toUpperCase()">
    <button class="escaner" onclick="App.Escaner.abrirExpediente()">📄 ESCANEAR DATOS</button>

    <label>JUZGADO</label>
    <div class="combo-wrapper">
        <div class="combo">
            <input id="juzgado" placeholder="SELECCIONAR" oninput="this.value=this.value.toUpperCase()">
            <button onclick="App.UI.toggleLista('listaJuzgado')">▼</button>
        </div>
        <div id="listaJuzgado" class="lista"></div>
    </div>

    <label>DESCRIPCIÓN DE HECHOS</label>
    <textarea id="diligencias" oninput="this.value=this.value.toUpperCase()"></textarea>

    <label>👮 OFICIAL ACTUANTE</label>

<!-- ================= SCRIPT OPTIMIZADO ===== -->
<script>
const App = {
    Data: {
        oficiales: [],
        drogas: [],
        presentaciones: {},
        tiposPlantilla: [],
        delitosPlantilla: {},
        unidades: [],
        grupos: [],
        formsList: [],
        juzgados: ["PRIMER CIRCUITO JUDICIAL DE SAN JOSÉ", "SEGUNDO CIRCUITO JUDICIAL DE SAN JOSÉ"],
        nacionalidadesBase: ["COSTARRICENSE", "NICARAGÜENSE", "VENEZOLANO", "COLOMBIANO"],
        cantidadesBase: ["10", "25", "50", "100"],
        
        estadosAnteriores: {},
        timersReversion: {},

        dispararReversion(key, btnId) {
            let btn = document.getElementById(btnId);
            if(!btn) return;
            btn.style.display = 'block';
            if(this.timersReversion[key]) {
                clearTimeout(this.timersReversion[key]);
            }
            this.timersReversion[key] = setTimeout(() => {
                btn.style.display = 'none';
            }, 5000);
        },

        respaldar(key) {
            if(key === 'presentaciones') {
                this.estadosAnteriores[key] = JSON.parse(JSON.stringify(this.presentaciones));
            } else if(key === 'delitosPlantilla') {
                this.estadosAnteriores[key] = JSON.parse(JSON.stringify(this.delitosPlantilla));
            } else {
                this.estadosAnteriores[key] = [...this[key]];
            }
        },

        revertir(key, btnId) {
            if(this.estadosAnteriores[key]) {
                if(key === 'presentaciones') {
                    this.presentaciones = JSON.parse(JSON.stringify(this.estadosAnteriores[key]));
                } else if(key === 'delitosPlantilla') {
                    this.delitosPlantilla = JSON.parse(JSON.stringify(this.estadosAnteriores[key]));
                } else {
                    this[key] = [...this.estadosAnteriores[key]];
                }
                this.guardar();
                App.UI.actualizarListas();
                if(App.Modulos.Datos.refrescarSelectsDatos) App.Modulos.Datos.refrescarSelectsDatos();
                let btn = document.getElementById(btnId);
                if(btn) btn.style.display = 'none';
                if(this.timersReversion[key]) clearTimeout(this.timersReversion[key]);
            }
        },
        
        cargar() {
            this.oficiales = JSON.parse(localStorage.getItem("oficiales")) || [];
            this.drogas = JSON.parse(localStorage.getItem("drogas")) || [];
            this.presentaciones = JSON.parse(localStorage.getItem("presentaciones")) || {};
            this.tiposPlantilla = JSON.parse(localStorage.getItem("tiposPlantilla")) || [];
            this.delitosPlantilla = JSON.parse(localStorage.getItem("delitosPlantilla")) || {};
            this.unidades = JSON.parse(localStorage.getItem("unidades")) || [];
            this.grupos = JSON.parse(localStorage.getItem("grupos")) || [];
            this.formsList = JSON.parse(localStorage.getItem("formsList")) || [];
            
            let defaultDrogas = ["MARIHUANA", "COCAINA", "CRACK", "WAX", "TUSI", "EXTASIS", "METANFETAMINA"];
            defaultDrogas.forEach(d => {
                if(!this.drogas.includes(d)) this.drogas.push(d);
            });

            let defaultPres = {
                "MARIHUANA": ["PUCHO", "TOCOLA", "CIGARRILLO", "GRAMOS"],
                "COCAINA": ["PUNTAS", "DOSIS", "GRAMOS"],
                "CRACK": ["PIEDRA", "DOSIS", "GRAMOS"],
                "WAX": ["DOSIS", "RECIPIENTE", "GRAMOS"],
                "TUSI": ["PUNTAS", "DOSIS", "GRAMOS"],
                "EXTASIS": ["PASTILLA", "DOSIS", "GRAMOS"],
                "METANFETAMINA": ["PASTILLA", "DOSIS", "GRAMOS"]
            };
            for(let d in defaultPres) {
                if(!this.presentaciones[d]) {
                    this.presentaciones[d] = defaultPres[d];
                } else {
                    this.presentaciones[d] = this.presentaciones[d].filter(p => p !== "HALLAZGO" && p !== "GRAMOS");
                    this.presentaciones[d].push("GRAMOS");
                }
            }
            // Asegurar que todas las drogas tengan "GRAMOS" al final
            for(let d of this.drogas) {
                if(!this.presentaciones[d]) {
                    this.presentaciones[d] = ["GRAMOS"];
                } else {
                    this.presentaciones[d] = this.presentaciones[d].filter(p => p !== "HALLAZGO" && p !== "GRAMOS");
                    this.presentaciones[d].push("GRAMOS");
                }
            }

            let defaultTipos = ["CAPTURA", "PRESENTACIÓN", "FISCALÍA DE FLAGRANCIA", "FISCALÍA DE TURNO EXTRAORDINARIO", "ASALTO", "HURTO", "TACHA A LOCAL", "TACHA A VEHÍCULO", "ROBO A VEHÍCULO", "ROBO A LOCAL", "ROBO A VIVIENDA", "AGRESIONES", "VIOLENCIA DOMÉSTICA", "REMISIÓN A PANI", "APREMIO CORPORAL"];
            defaultTipos.forEach(t => {
                if(!this.tiposPlantilla.includes(t)) this.tiposPlantilla.push(t);
            });

            let defaultDelitos = {
                "CAPTURA": ["ROBO AGRAVADO", "ROBO SIMPLE", "DELITOS INFORMÁTICOS"],
                "PRESENTACIÓN": ["ROBO AGRAVADO", "ROBO SIMPLE", "DELITOS INFORMÁTICOS"],
                "FISCALÍA DE FLAGRANCIA": ["ROBO AGRAVADO", "ROBO SIMPLE", "DELITOS INFORMÁTICOS"],
                "FISCALÍA DE TURNO EXTRAORDINARIO": ["ROBO AGRAVADO", "ROBO SIMPLE", "DELITOS INFORMÁTICOS"]
            };
            for(let t in defaultDelitos) {
                if(!this.delitosPlantilla[t]) {
                    this.delitosPlantilla[t] = defaultDelitos[t];
                }
            }

            this.guardar();
        },
        guardar() {
            localStorage.setItem("oficiales", JSON.stringify(this.oficiales));
            localStorage.setItem("drogas", JSON.stringify(this.drogas));
            localStorage.setItem("presentaciones", JSON.stringify(this.presentaciones));
            localStorage.setItem("tiposPlantilla", JSON.stringify(this.tiposPlantilla));
            localStorage.setItem("delitosPlantilla", JSON.stringify(this.delitosPlantilla));
            localStorage.setItem("unidades", JSON.stringify(this.unidades));
            localStorage.setItem("grupos", JSON.stringify(this.grupos));
            localStorage.setItem("formsList", JSON.stringify(this.formsList));
        }
    },

    UI: {
        ocultarTodo() {
            ["moduloDatos", "moduloDrogas", "moduloPlantilla", "moduloTrabajoDiario", "moduloEscaner", "moduloExpediente", "moduloFormsContenedor"].forEach(id => {
                let el = document.getElementById(id);
                if(el) el.style.display = "none";
            });
            document.querySelectorAll('.lista').forEach(lista => lista.classList.remove('mostrar'));
        },
        mostrar(id) {
            this.ocultarTodo();
            document.getElementById(id).style.display = "block";
            if(id === 'moduloPlantilla') App.Utilidades.cargarFechaHoraPlantilla();
            if(id === 'moduloDrogas') App.Utilidades.cargarFechaHora();
            if(id === 'moduloTrabajoDiario') App.Modulos.Trabajo.inicializarBase();
            if(id === 'moduloDatos') {
                App.Modulos.Datos.refrescarSelectsDatos();
            }
        },
        toggleLista(id) {
            document.querySelectorAll('.lista').forEach(lista => {
                if(lista.id !== id) lista.classList.remove('mostrar');
            });
            let lista = document.getElementById(id);
            lista.classList.toggle('mostrar');
        },
        crearLista(id, datos, campo, onSeleccionar) {
            let lista = document.getElementById(id);
            if(!lista) return;
            lista.innerHTML = "";
            let inicio = document.createElement("div");
            inicio.innerHTML = "SELECCIONAR";
            inicio.onclick = () => { document.getElementById(campo).value = ""; lista.classList.remove('mostrar'); if(onSeleccionar) onSeleccionar(""); };
            lista.appendChild(inicio);

            (datos || []).filter(valor => (typeof valor === "object" ? (valor.nombre || "") : (valor || "")).toUpperCase() !== "HALLAZGO").forEach(valor => {
                let item = document.createElement("div");
                let texto = (typeof valor === "object" ? (valor.nombre || "") : (valor || "")).toUpperCase();
                item.innerHTML = texto;
                item.onclick = () => { document.getElementById(campo).value = texto; lista.classList.remove('mostrar'); if(onSeleccionar) onSeleccionar(texto); };
                lista.appendChild(item);
            });
        },
        llenarSelect(id, datos) {
            let s = document.getElementById(id);
            if(!s) return;
            s.innerHTML = "";
            let inicio = document.createElement("option");
            inicio.text = "SELECCIONAR";
            s.add(inicio);
            (datos || []).filter(x => (typeof x === "object" ? (x.nombre || "") : (x || "")).toUpperCase() !== "HALLAZGO").forEach(x => {
                let op = document.createElement("option");
                let val = (typeof x === "object" ? (x.nombre || "") : (x || "")).toUpperCase();
                op.text = val;
                op.value = val;
                s.add(op);
            });
        },
        actualizarListas() {
            this.crearLista("listaDrogasUso", App.Data.drogas, "droga", (val) => App.Modulos.Incidente.onCambioDroga(val));
            App.Modulos.Incidente.actualizarPresentacionDinamica();
            this.crearLista("listaCantidadNum", App.Data.cantidadesBase, "cantidadNum", () => App.Modulos.Incidente.actualizarPresentacionDinamica());
            this.crearLista("listaActuante", App.Data.oficiales, "oficialActuante");
            this.crearLista("listaAsistente", App.Data.oficiales, "oficialAsistente");
            this.crearLista("listaPlantillaActuante", App.Data.oficiales, "plantillaActuante");
            this.crearLista("listaPlantillaAsistente", App.Data.oficiales, "plantillaAsistente");
            this.crearLista("listaUnidad", App.Data.unidades, "unidad");
            this.crearLista("listaGrupoUso", App.Data.grupos, "grupo");
            this.crearLista("listaTipo", App.Data.tiposPlantilla, "tipoPlantilla", (val) => App.Modulos.Aprehension.onCambioTipoPlantilla(val));
            this.crearLista("listaDelitoPlantilla", App.Data.delitosPlantilla.hasOwnProperty(tipoPlantilla.value.trim().toUpperCase()) ? App.Data.delitosPlantilla[tipoPlantilla.value.trim().toUpperCase()] : [], "delitoPlantilla");
            this.crearLista("listaJuzgado", App.Data.juzgados, "juzgado");
            this.crearLista("listaNacionalidadPlantilla", App.Data.nacionalidadesBase, "nacionalidadPlantilla");

            this.llenarSelect("listaOficiales", App.Data.oficiales);
            this.llenarSelect("listaDrogas", App.Data.drogas);
            this.llenarSelect("listaUnidades", App.Data.unidades);
            this.llenarSelect("listaGrupo", App.Data.grupos);
            this.llenarSelect("listaTiposPlantilla", App.Data.tiposPlantilla);
            App.Modulos.Forms.llenarSelectForms();
        }
    },

    Utilidades: {
        formatearFechaDMA(fechaISO) {
            if(!fechaISO) return "";
            let partes = fechaISO.split("-");
            if(partes.length !== 3) return fechaISO;
            let [anio, mes, dia] = partes;
            return `${dia}-${mes}-${anio}`;
        },
        cargarFechaHora() {
            let ahora = new Date();
            let anio = ahora.getFullYear();
            let mes = String(ahora.getMonth() + 1).padStart(2, "0");
            let dia = String(ahora.getDate()).padStart(2, "0");
            fecha.value = `${anio}-${mes}-${dia}`;
            hora.value = String(ahora.getHours()).padStart(2, "0") + ":" + String(ahora.getMinutes()).padStart(2, "0");
        },
        cargarFechaHoraPlantilla() {
            let ahora = new Date();
            let anio = ahora.getFullYear();
            let mes = String(ahora.getMonth() + 1).padStart(2, "0");
            let dia = String(ahora.getDate()).padStart(2, "0");
            fechaPlantilla.value = `${anio}-${mes}-${dia}`;
            horaPlantilla.value = String(ahora.getHours()).padStart(2, "0") + ":" + String(ahora.getMinutes()).padStart(2, "0");
        },
        obtenerGPS(campo) {
            if(!navigator.geolocation) { alert("GPS NO DISPONIBLE"); return; }
            navigator.geolocation.getCurrentPosition(pos => {
                this.buscarLugar(pos.coords.latitude, pos.coords.longitude, campo);
            });
        },
        buscarLugar(lat, lon, campo) {
            let consulta = `[out:json];(way(around:50,${lat},${lon})["highway"]["name"];);out tags;`;
            fetch("https://overpass-api.de/api/interpreter?data=" + encodeURIComponent(consulta))
            .then(r => r.json())
            .then(data => {
                let avenida = "", calle = "", respaldo = "";
                data.elements.forEach(v => {
                    let nombre = v.tags.name || "";
                    if(!nombre) return;
                    if(!respaldo) respaldo = nombre;
                    let av = nombre.match(/avenida\s*(\d+)/i);
                    if(av && !avenida) avenida = "AVENIDA " + av[1];
                    let ca = nombre.match(/calle\s*(\d+)/i);
                    if(ca && !calle) calle = "CALLE " + ca[1];
                });
                let resultado = (avenida + " " + calle).trim() || respaldo || "SIN REFERENCIA";
                let el = document.getElementById(campo);
                if(el && !el.value.trim()) el.value = resultado.toUpperCase();
            }).catch(() => {
                let el = document.getElementById(campo);
                if(el && !el.value.trim()) el.value = "SIN REFERENCIA";
            });
        },
        abrirMapa(idCampo) {
            let val = document.getElementById(idCampo).value.trim();
            if(!val) { alert("POR FAVOR INGRESE O CARGUE UNA UBICACIÓN PRIMERO."); return; }
            window.open("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(val), "_blank");
        },
        obtenerOficial(nombre) {
            return App.Data.oficiales.find(x => (x.nombre || "").toUpperCase() === (nombre || "").toUpperCase());
        },
        mostrarOficialForms(nombre) {
            let oficial = this.obtenerOficial(nombre);
            return oficial ? `${oficial.nombre || ""} / CONTRASEÑA:${oficial.clave || ""}`.toUpperCase() : (nombre || "").toUpperCase();
        },
        obtenerCedulaOficial(nombre) {
            let oficial = this.obtenerOficial(nombre);
            return oficial ? (oficial.cedula || "").toUpperCase() : "";
        },
        formatearDateTimeLocal(dt) {
            if (!dt) return "";
            let anio = dt.getFullYear();
            let mes = String(dt.getMonth() + 1).padStart(2, '0');
            let dia = String(dt.getDate()).padStart(2, '0');
            let hora = String(dt.getHours()).padStart(2, '0');
            let min = String(dt.getMinutes()).padStart(2, '0');
            return `${anio}-${mes}-${dia}T${hora}:${min}`;
        }
    },

    Modulos: {
        Datos: {
            refrescarSelectsDatos() {
                App.UI.llenarSelect("listaDrogasPresentacion", App.Data.drogas);
                App.UI.llenarSelect("listaTiposPlantillaDelito", App.Data.tiposPlantilla);
                this.cambiarDrogaPresentacion();
                this.cambiarTipoPlantillaDelito();
            },
            revertirCambio(key) {
                let btnMap = {
                    'oficiales': 'btnRevertirOficial',
                    'drogas': 'btnRevertirDroga',
                    'presentaciones': 'btnRevertirPresentacion',
                    'tiposPlantilla': 'btnRevertirTipoPlantilla',
                    'delitosPlantilla': 'btnRevertirDelito',
                    'unidades': 'btnRevertirUnidad',
                    'grupos': 'btnRevertirGrupo',
                    'formsList': 'btnRevertirForms'
                };
                App.Data.revertir(key, btnMap[key]);
            },
            seleccionarOficial() {
                let dato = listaOficiales.value;
                if(dato && dato !== "SELECCIONAR") {
                    let o = App.Data.oficiales.find(x => (x.nombre || "").toUpperCase() === dato);
                    if(o) { nuevoOficial.value = o.nombre; cedulaOficial.value = o.cedula; claveOficial.value = o.clave || ""; }
                    btnModificarOficial.style.display = "block"; btnAgregarOficial.style.display = "none";
                } else {
                    nuevoOficial.value = ""; cedulaOficial.value = ""; claveOficial.value = "";
                    btnModificarOficial.style.display = "none"; btnAgregarOficial.style.display = "block";
                }
            },
            guardarOficial() {
                let nombre = nuevoOficial.value.trim();
                if(nombre) {
                    App.Data.respaldar('oficiales');
                    App.Data.oficiales.push({ nombre, cedula: cedulaOficial.value.trim(), clave: claveOficial.value });
                    App.Data.guardar(); App.UI.actualizarListas();
                    nuevoOficial.value = ""; cedulaOficial.value = ""; claveOficial.value = "";
                    App.Data.dispararReversion('oficiales', 'btnRevertirOficial');
                }
            },
            modificarOficial() {
                let val = listaOficiales.value;

        Incidente: {
            itemsDroga: [],
            editandoIndex: -1,

            obtenerPresentacionesActuales() {
                let d = (droga && droga.value ? droga.value : "").toUpperCase().trim();
                return (App.Data.presentaciones[d] || []).filter(p => p !== "HALLAZGO");
            },

            obtenerPresentacionTransformada(drogName, presName, cantidadVal) {
                let d = (drogName || "").toUpperCase().trim();
                let p = (presName || "").toUpperCase().trim();
                let num = parseInt(cantidadVal) || 1;
                let esPlural = num > 1;

                if (p === "GRAMOS") return "GRAMOS";

                if (d === "MARIHUANA") {
                    if (p === "PUCHO" || p === "PUCHOS") {
                        return esPlural ? "PUCHOS" : "PUCHO";
                    }
                    if (p === "TOCOLA" || p === "TOCOLAS") {
                        return esPlural ? "TOCOLAS" : "TOCOLA";
                    }
                    if (p === "CIGARRILLO" || p === "CIGARRILLOS") {
                        return esPlural ? "CIGARRILLOS" : "CIGARRILLO";
                    }
                }
                if (d === "COCAINA" || d === "TUSI") {
                    if (p === "PUNTA" || p === "PUNTAS") {
                        return esPlural ? "PUNTAS" : "PUNTA";
                    }
                }
                if (d === "CRACK") {
                    if (p === "PIEDRA" || p === "PIEDRAS") {
                        return esPlural ? "PIEDRAS" : "PIEDRA";
                    }
                }
                if (d === "WAX") {
                    if (p === "RECIPIENTE" || p === "RECIPIENTES") {
                        return esPlural ? "RECIPIENTES" : "RECIPIENTE";
                    }
                }
                if (d === "EXTASIS" || d === "METANFETAMINA") {
                    if (p === "PASTILLA" || p === "PASTILLAS") {
                        return esPlural ? "PASTILLAS" : "PASTILLA";
                    }
                }
                return p;
            },

            actualizarPresentacionDinamica() {
                let d = (droga && droga.value ? droga.value : "").toUpperCase().trim();
                let cStr = (cantidadNum && cantidadNum.value ? cantidadNum.value : "1").trim();
                let num = parseInt(cStr) || 1;
                let baseArr = (App.Data.presentaciones[d] || []).filter(item => item !== "HALLAZGO");

                let arrTransformado = baseArr.map(p => this.obtenerPresentacionTransformada(d, p, num));
                App.UI.crearLista("listaPresentacionUso", arrTransformado, "presentacion");

                if (presentacion.value.trim()) {
                    let actualPres = presentacion.value.trim();
                    let baseActual = baseArr.find(b => this.obtenerPresentacionTransformada(d, b, 1) === actualPres || this.obtenerPresentacionTransformada(d, b, 2) === actualPres);
                    if (baseActual) {
                        presentacion.value = this.obtenerPresentacionTransformada(d, baseActual, num);
                    }
                }
            },

            onCambioDroga(val) {
                presentacion.value = "";
                this.actualizarPresentacionDinamica();
            },

            cambiarCantidadValor(delta) {
                let val = parseInt(cantidadNum.value) || 0;
                let nuevo = val + delta;
                if(nuevo < 1) nuevo = 1;
                cantidadNum.value = String(nuevo).padStart(2, '0');
                this.actualizarPresentacionDinamica();
            },

            guardarDroga() {
                let d = droga.value.trim(), p = presentacion.value.trim(), c = cantidadNum.value.trim();
                if(!d || !c) { alert("SELECCIONE TIPO DE DROGA Y CANTIDAD"); return; }
                let item = { droga: d, presentacion: p, cantidad: c };
                if(this.editandoIndex >= 0) {
                    this.itemsDroga[this.editandoIndex] = item;
                } else {
                    this.itemsDroga.push(item);
                }
                
                let drogaSeleccionada = droga.value;
                this.limpiarCamposDroga();
                droga.value = drogaSeleccionada;
                this.actualizarPresentacionDinamica();
                
                this.renderLista();
            },
            renderLista() {
                let cont = document.getElementById("listaDrogasGuardadas");
                cont.innerHTML = "";
                if(this.itemsDroga.length === 0) {
                    cont.innerHTML = `<div class="vacio">SIN DROGAS AGREGADAS</div>`;
                    return;

            obtenerRangoHorario(ahora) {
                let diaSemana = ahora.getDay();
                let esFinde = (diaSemana === 5 || diaSemana === 6);
                let horaInicioConfig = esFinde ? 16 : 14;
                let horaFinConfig = esFinde ? 3 : 1;
                
                let anio = ahora.getFullYear(), mes = ahora.getMonth(), dia = ahora.getDate();
                let hActual = ahora.getHours();
                
                let dtInicio = new Date(anio, mes, dia, horaInicioConfig, 0, 0);
                let dtFin = new Date(anio, mes, dia, horaFinConfig, 0, 0);
                if (esFinde) {
                    dtFin.setDate(dtFin.getDate() + 1);
                } else {
                    if (horaFinConfig === 1) {
                        dtFin.setDate(dtFin.getDate() + 1);
                    }
                }

                if (hActual >= 0 && hActual < horaInicioConfig) {
                    dtInicio.setDate(dtInicio.getDate() - 1);
                    dtFin.setDate(dtFin.getDate() - 1);
                }

                return { inicio: dtInicio, fin: dtFin };

                let minActual = ahora.getMinutes();

                let dtFin = new Date(anio, mes, dia, horaActual, minActual, ahora.getSeconds());

            filtrarYRenderizar(dtInicio, dtFin) {
                let historial = JSON.parse(localStorage.getItem("historialTrabajo")) || [];
                let unMesAtras = Date.now() - (30 * 24 * 60 * 60 * 1000);
                historial = historial.filter(x => (x.timestamp || 0) >= unMesAtras);

                    let t = item.timestamp || new Date(`${item.fecha}T${item.hora || "00:00"}`).getTime();
                    return t >= dtInicio && t <= dtFin;

                if(this.ultimoGeneradoCargadoTimestamp !== null) {

                        if(itemUltimo.timestamp === this.ultimoGeneradoCargadoTimestamp) {

            }
        },

        Forms: {
            camposIncidente: ["NOMBRE DEL IMPUTADO", "CÉDULA IMPUTADO", "NACIONALIDAD", "FECHA NACIMIENTO IMPUTADO", "TIPO Y CANTIDAD DE DROGA", "LUGAR DEL SUCESO", "FECHA", "HORA", "OFICIAL ACTUANTE", "CÉDULA OFICIAL ACTUANTE", "OFICIAL ASISTENTE", "CÉDULA OFICIAL ASISTENTE", "GRUPO"],
            camposAprehension: ["NOMBRE DEL IMPUTADO", "CÉDULA IMPUTADO", "NACIONALIDAD", "FECHA NACIMIENTO IMPUTADO", "NOMBRE DEL DELITO", "DESCRIPCIÓN DE HECHOS", "TIPO DE CAPTURA", "NÚMERO DE EXPEDIENTE", "ASESOR LEGAL", "LUGAR DEL SUCESO", "HORA", "FECHA", "OFICIAL ACTUANTE", "CÉDULA OFICIAL ACTUANTE", "OFICIAL ASISTENTE", "CÉDULA OFICIAL ASISTENTE", "GRUPO"],
            moduloActual: '',
            ventanaForms: null,
            avisoFormsMostrado: false,

            abrir(tipo) {
                this.moduloActual = tipo;
                App.UI.ocultarTodo();
                document.getElementById("moduloFormsContenedor").style.display = "block";
                if(tipo === 'incidente') {
                    tituloForms.innerHTML = "📋 REGISTRO INCIDENTE";
                    this.construirLista(this.camposIncidente);
                    this.llenarIncidente();
                } else {
                    tituloForms.innerHTML = "📋 PLANTILLA APREHENSIÓN";
                    this.construirLista(this.camposAprehension);
                    this.llenarAprehension();
                }
                this.actualizarEstadoBoton();
            },
            llenarIncidente() {
                let items = App.Modulos.Incidente.itemsDroga;
                if(items.length === 0 && droga.value.trim() && cantidadNum.value.trim()) {
                    items = [{ droga: droga.value.trim(), presentacion: presentacion.value.trim(), cantidad: cantidadNum.value.trim() }];
                }

                let agrupados = {};
                items.forEach(it => {
                    let d = (it.droga || "").toUpperCase();
                    if(!agrupados[d]) agrupados[d] = [];
                    agrupados[d].push(it);
                });

                let partesDroga = [];
                for(let d in agrupados) {
                    let subPartes = agrupados[d].map(it => {
                        let p = (it.presentacion || "").toUpperCase();
                        let c = it.cantidad || "1";
                        if(p === "GRAMOS") {
                            return `${c} GRAMOS ${d}`;
                        } else {
                            return `${c} ${p} ${d}`;
                        }
                    });
                    partesDroga.push(subPartes.join(" / "));
                }
                let textoDroga = partesDroga.join(" / ");

                const mapVal = {
                    0: nombre.value, 
                    1: cedula.value, 
                    2: nacionalidadPlantilla.value, 
                    3: fechaNacimientoIncidente.value,
                    4: textoDroga, 
                    5: lugar.value, 
                    6: fecha.value, 
                    7: hora.value,
                    8: App.Utilidades.mostrarOficialForms(oficialActuante.value),
                    9: App.Utilidades.obtenerCedulaOficial(oficialActuante.value),
                    10: oficialAsistente.value, 
                    11: App.Utilidades.obtenerCedulaOficial(oficialAsistente.value),
                    12: grupo.value
                };
                for(let i in mapVal) { let el = document.getElementById(`datoForms${i}`); if(el && !el.value) el.value = mapVal[i] || ""; }
            },
            llenarAprehension() {
                const mapVal = {
                    0: nombrePlantilla.value, 
                    1: cedulaPlantilla.value, 
                    2: nacionalidadPlantilla.value, 
                    3: fechaNacimientoPlantilla.value,
                    4: delitoPlantilla.value, 
                    5: diligencias.value, 
                    6: tipoPlantilla.value, 
                    7: expediente.value || App.Escaner.expedienteEscaneado,
                    8: asesor.value, 
                    9: lugarPlantilla.value, 
                    10: horaPlantilla.value, 
                    11: fechaPlantilla.value,
                    12: App.Utilidades.mostrarOficialForms(plantillaActuante.value),
                    13: App.Utilidades.obtenerCedulaOficial(plantillaActuante.value),
                    14: plantillaAsistente.value, 
                    15: App.Utilidades.obtenerCedulaOficial(plantillaAsistente.value),
                    16: grupo.value
                };
                for(let i in mapVal) { let el = document.getElementById(`datoForms${i}`); if(el && !el.value) el.value = mapVal[i] || ""; }
            },
            construirLista(campos) {
                let html = "";
                campos.forEach((campo, i) => {
                    let entrada = "";
                    if(campo === "NACIONALIDAD" || campo === "GRUPO") {
                        let opts = `<option>SELECCIONAR</option>`;
                        let source = campo === "NACIONALIDAD" ? App.Data.nacionalidadesBase : App.Data.grupos;
                        source.forEach(n => opts += `<option value="${n}">${n}</option>`);
                        entrada = `<div class="nacionalidad"><input id="datoForms${i}"><select onchange="document.getElementById('datoForms${i}').value=this.value">${opts}</select></div>`;
                    } else if(campo === "DESCRIPCIÓN DE HECHOS") {
                        entrada = `<textarea id="datoForms${i}"></textarea>`;
                    } else {
                        entrada = `<input id="datoForms${i}">`;
                    }
                    html += `<div class="campo"><label>${campo}</label>${entrada}<div class="botones"><button class="btn-copiar" onclick="App.Modulos.Forms.copiarSilencioso(${i})">COPIAR</button></div></div>`;
                });
                listaForms.innerHTML = html;
                tituloForms.innerHTML.includes("INCIDENTE") ? this.llenarIncidente() : this.llenarAprehension();
            },
            copiarSilencioso(id) {
                let d = document.getElementById(`datoForms${id}`);
                if(d) {
                    navigator.clipboard.writeText(d.value);
                }
            },
            obtenerLink() {
                let selectVal = linkFormsSelect.value;
                if(selectVal && selectVal !== "SELECCIONAR") {
                    let item = App.Data.formsList.find(x => (typeof x === "object" ? (x.link || x.nombre || "") : x) === selectVal);
                    if(item) return typeof item === "object" ? item.link : item;
                }
                if(linkForms.value.trim()) return linkForms.value.trim();
                if(App.Data.formsList.length > 0) {
                    let first = App.Data.formsList[0];
                    return typeof first === "object" ? (first.link || "") : first;
                }
                return "https://forms.office.com/r/8EAQQ20WLQ";
            },
            actualizarEstadoBoton() {
                if(!btnPrincipalExportar) return;
                btnPrincipalExportar.innerHTML = (this.ventanaForms && !this.ventanaForms.closed) ? "REGRESAR AL LINK" : "EXPORTAR";
            },
            manejarBotonPrincipal() {
                let url = this.obtenerLink();
                if(!this.avisoFormsMostrado) {
                    alert("AVISO: Por favor usa el gestor de ventanas (cierra la pestaña de Forms o vuelve a esta app) en lugar de usar el botón de 'Regresar' dentro de Forms, para evitar que se pierdan los datos.");
                    this.avisoFormsMostrado = true;
                }
                if(this.ventanaForms && !this.ventanaForms.closed) {
                    this.ventanaForms.location.href = url; this.ventanaForms.focus();
                } else {
                    this.ventanaForms = window.open(url, "_blank");
                }
                this.actualizarEstadoBoton();
            },
            llenarSelectForms() {
                if(!linkFormsSelect) return;
                linkFormsSelect.innerHTML = "<option>SELECCIONAR</option>";
                App.Data.formsList.forEach(f => {
                    let t = typeof f === "object" ? (f.link || f.nombre || "") : f;
                    if(t) { let op = document.createElement("option"); op.text = t; op.value = t; linkFormsSelect.add(op); }
                });
            },
            volver() {
                App.UI.mostrar(this.moduloActual === 'incidente' ? 'moduloDrogas' : 'moduloPlantilla');
            }
        }
    },

    Escaner: {
        cropper: null,
        cropperExpediente: null,
        modoActual: '',
        expedienteEscaneado: '',

        abrir(mod) {
            this.modoActual = mod;
            App.UI.ocultarTodo();
            document.getElementById("moduloEscaner").style.display = "block";
            escNombre.value = ""; escCedula.value = ""; escFecha.value = "";
            let img = document.getElementById("imagenEscaner");
            img.src = "";
            let fileInput = document.getElementById("archivoEscaner");
            if(fileInput) fileInput.value = "";
            if(this.cropper) { this.cropper.destroy(); this.cropper = null; }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        abrirExpediente() {
            App.UI.ocultarTodo();
            document.getElementById("moduloExpediente").style.display = "block";
            textoExpediente.value = "";
            let img = document.getElementById("imagenExpediente");
            img.src = "";
            let fileInput = document.getElementById("archivoExpediente");
            if(fileInput) fileInput.value = "";
            if(this.cropperExpediente) { this.cropperExpediente.destroy(); this.cropperExpediente = null; }
            window.scrollTo({ top: 0, behavior: 'smooth' });
        },
        cerrar() {
            if(this.cropper) { this.cropper.destroy(); this.cropper = null; }
            App.UI.mostrar(this.modoActual === 'incidente' ? 'moduloDrogas' : 'moduloPlantilla');
        },
        cerrarExpediente() {
            if(this.cropperExpediente) { this.cropperExpediente.destroy(); this.cropperExpediente = null; }
            App.UI.mostrar('moduloPlantilla');
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        },
        
        cargarImagen(event, imgElementId) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = (e) => {
                let image = document.getElementById(imgElementId);
                image.src = e.target.result;
                this.inicializarCropper(imgElementId, false);
            };
            reader.readAsDataURL(file);
        },

        cargarImagenExpediente(event) {
            let file = event.target.files[0];
            if (!file) return;
            let reader = new FileReader();
            reader.onload = (e) => {
                let image = document.getElementById("imagenExpediente");
                image.src = e.target.result;
                this.inicializarCropper("imagenExpediente", true);
            };
            reader.readAsDataURL(file);
        },

        rotarImagen(imgElementId) {
            if(this.cropper) {
                this.cropper.rotate(90);
            }
        },

        rotarImagenExpediente() {
            if(this.cropperExpediente) {
                this.cropperExpediente.rotate(90);
            }
        },

        inicializarCropper(imgElementId, isExpediente = false) {
            let image = document.getElementById(imgElementId);
            if(isExpediente) {
                if(this.cropperExpediente) this.cropperExpediente.destroy();
                this.cropperExpediente = new Cropper(image, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.3,
                    responsive: true,
                    restore: true,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                });
            } else {
                if(this.cropper) this.cropper.destroy();
                this.cropper = new Cropper(image, {
                    aspectRatio: NaN,
                    viewMode: 1,
                    dragMode: 'move',
                    autoCropArea: 0.3,
                    responsive: true,
                    restore: true,
                    guides: true,
                    center: true,
                    highlight: false,
                    cropBoxMovable: true,
                    cropBoxResizable: true,
                    toggleDragModeOnDblclick: false,
                });
            }
        },

        leerCampo(campo) {
            if(!this.cropper) { alert("POR FAVOR CARGUE UNA IMAGEN PRIMERO"); return; }
            let canvas = this.cropper.getCroppedCanvas();
            if(!canvas) { alert("SELECCIONE UN ÁREA VÁLIDA EN LA IMAGEN"); return; }
            
            let btnActivo = event.target;
            btnActivo.innerText = "ESCANEANDO...";
            
            Tesseract.recognize(canvas.toDataURL(), 'spa', {
                logger: m => {}
            }).then(({ data: { text } }) => {
                btnActivo.innerText = "📷 ESCANEAR DATOS";
                let limpio = text.replace(/[\n\r]+/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
                
                if(campo === 'nombre') {
                    escNombre.value = limpio;
                } else if(campo === 'cedula') {
                    let matchCed = limpio.match(/\b\d{1,4}[-]?\d{3,4}[-]?\d{3,4}\b/) || limpio.match(/\d{7,10}/);
                    if (matchCed) {
                        escCedula.value = matchCed[0].replace(/[-\s]/g, '');
                    } else {
                        escCedula.value = limpio.replace(/[-\s]/g, '');
                    }
                } else if(campo === 'fecha') {
                    let matchFecha = limpio.match(/\d{2}[\/\-]\d{2}[\/\-]\d{4}/);
                    escFecha.value = matchFecha ? matchFecha[0] : limpio;
                }
            }).catch(() => {
                btnActivo.innerText = "📷 ESCANEAR DATOS";
                alert("ERROR AL LEER EL TEXTO");
            });
        },

        leerExpediente() {
            if(!this.cropperExpediente) { alert("POR FAVOR CARGUE UNA IMAGEN PRIMERO"); return; }
            let canvas = this.cropperExpediente.getCroppedCanvas();
            if(!canvas) { alert("SELECCIONE UN ÁREA VÁLIDA EN LA IMAGEN"); return; }
            
            let btnActivo = event.target;
            btnActivo.innerText = "ESCANEANDO...";
            
            Tesseract.recognize(canvas.toDataURL(), 'spa', {
                logger: m => {}
            }).then(({ data: { text } }) => {
                btnActivo.innerText = "📷 ESCANEAR DATOS";
                let limpio = text.replace(/[\n\r]+/g, ' ').replace(/\s+/g, ' ').trim().toUpperCase();
                textoExpediente.value = limpio;
            }).catch(() => {
                btnActivo.innerText = "📷 ESCANEAR DATOS";
                alert("ERROR AL LEER EL EXPEDIENTE");
            });
        },

        aceptar() {
            let n = escNombre.value.trim();
            let c = escCedula.value.trim();
            let f = escFecha.value.trim();

            if(this.modoActual === 'incidente') {
                if(n) nombre.value = n;
                if(c) cedula.value = c;
                if(f) fechaNacimientoIncidente.value = f;
            } else {
                if(n) nombrePlantilla.value = n;
                if(c) cedulaPlantilla.value = c;
                if(f) fechaNacimientoPlantilla.value = f;
            }
            this.cerrar();
        },

        aceptarExpediente() {
            let val = textoExpediente.value.trim();
            if(!val) { alert("NO HAY EXPEDIENTE ESCANEADO"); return; }
            this.expedienteEscaneado = val;
            expediente.value = val;
            this.cerrarExpediente();
        }
    }
};

window.onload = () => {
    App.Data.cargar();
    App.UI.actualizarListas();
    App.UI.mostrar('moduloDrogas');
};
</script>
</body>
</html>

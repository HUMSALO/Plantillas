<script>

let cropper;

let cropperExpediente;


let moduloEscanerOrigen="";



let expedienteEscaneado="";



let datosEscaneados={

nombre:"",
cedula:"",
fecha:""

};



let tipos=[

"CAPTURA",
"PRESENTACIÓN",
"FISCALÍA DE FLAGRANCIA",
"FISCALÍA DE TURNO EXTRAORDINARIO",
"ASALTO",
"HURTO",
"TACHA A LOCAL",
"TACHA A VEHÍCULO",
"ROBO A VEHÍCULO",
"ROBO A LOCAL",
"ROBO A VIVIENDA",
"AGRESIONES",
"VIOLENCIA DOMÉSTICA",
"REMISIÓN A PANI",
"APREMIO CORPORAL"

];



let juzgados=[

"PRIMER CIRCUITO JUDICIAL DE SAN JOSÉ",
"SEGUNDO CIRCUITO JUDICIAL DE SAN JOSÉ"

];

let nacionalidadesBase=[
"COSTARRICENSE",
"NICARAGÜENSE",
"VENEZOLANO",
"COLOMBIANO"
];





window.onload=function(){

localStorage.removeItem("formsOrigen");

cargarDatos();


actualizarListas();

inicializarTrabajoDiarioBase();

// ================= PANTALLAS =================


function ocultarTodo(){


moduloDatos.style.display="none";

moduloDrogas.style.display="none";

moduloPlantilla.style.display="none";

moduloTrabajoDiario.style.display="none";

moduloEscaner.style.display="none";

moduloExpediente.style.display="none";

let contForms = document.getElementById("moduloFormsContenedor");
if(contForms) contForms.style.display="none";

}




function mostrarDatos(){


ocultarTodo();


moduloDatos.style.display="block";


}





function mostrarDrogas(){


ocultarTodo();


moduloDrogas.style.display="block";


}




function mostrarPlantilla(){


ocultarTodo();


moduloPlantilla.style.display="block";


cargarFechaHoraPlantilla();


}


let usuarioModificoFin = false;

function inicializarTrabajoDiarioBase(){
  let ultimaFecha = localStorage.getItem("trabajoFechaInicio");
  let ultimaHora = localStorage.getItem("trabajoHoraInicio");

  if(!ultimaFecha || !ultimaHora){
    let ahora = new Date();
    let fechaHoy = ahora.getFullYear()+"-"+String(ahora.getMonth()+1).padStart(2,"0")+"-"+String(ahora.getDate()).padStart(2,"0");
    let horaActual = String(ahora.getHours()).padStart(2,"0")+":"+String(ahora.getMinutes()).padStart(2,"0");
    document.getElementById("trabajoFechaInicio").value = fechaHoy;
    document.getElementById("trabajoHoraInicio").value = horaActual;
    usuarioModificoFin = false;
    calcularFechaFinAutomatica();
  } else {
    document.getElementById("trabajoFechaInicio").value = ultimaFecha;
    document.getElementById("trabajoHoraInicio").value = ultimaHora;
    usuarioModificoFin = false;
    calcularFechaFinAutomatica();
  }
}

function mostrarTrabajoDiario(){
  ocultarTodo();
  moduloTrabajoDiario.style.display="block";

  let fInicio = document.getElementById("trabajoFechaInicio").value;
  let hInicio = document.getElementById("trabajoHoraInicio").value;
  if(!fInicio || !hInicio){
    inicializarTrabajoDiarioBase();
  } else {
    if(!usuarioModificoFin){
      calcularFechaFinAutomatica();
    }
  }
}

function onFechaHoraInicioChange(){
  usuarioModificoFin = false;
  calcularFechaFinAutomatica();
}

function marcarModificacionFin(){
  usuarioModificoFin = true;
}



// ================= NAVEGACION ESCANER =================


function abrirEscaner(origen){


moduloEscanerOrigen=origen;


ocultarTodo();


moduloEscaner.style.display="block";


limpiarEscaner();


}




function cerrarEscaner(){


moduloEscaner.style.display="none";


if(moduloEscanerOrigen=="incidente"){

function buscarLugar(lat,lon,campo){



let consulta=`

[out:json];

(

way(around:50,${lat},${lon})["highway"]["name"];

);

out tags;

`;




fetch(

"https://overpass-api.de/api/interpreter?data="+

encodeURIComponent(consulta)

)



.then(r=>r.json())


.then(data=>{



let avenida="";

let calle="";

let respaldo="";




data.elements.forEach(function(v){



let nombre=v.tags.name || "";



if(nombre=="")return;



if(respaldo=="") respaldo=nombre;



let av=nombre.match(/avenida\s*(\d+)/i);



if(av && avenida==""){



avenida="AVENIDA "+av[1];


}




let ca=nombre.match(/calle\s*(\d+)/i);



if(ca && calle==""){



calle="CALLE "+ca[1];



}



});




let resultado="";



if(avenida!="")

resultado+=avenida;



if(calle!=""){


if(resultado!="")

resultado+=" ";



resultado+=calle;


}




if(resultado==""){



resultado=respaldo || "SIN REFERENCIA";


}




let elementoInput = document.getElementById(campo);
if(elementoInput && !elementoInput.value.trim()){
  elementoInput.value = resultado.toUpperCase();
}



})

.catch(function(){



let elementoInput = document.getElementById(campo);
if(elementoInput && !elementoInput.value.trim()){
  elementoInput.value = "SIN REFERENCIA";
}


});



}

// ================= TRABAJO DIARIO LOGICA =================

function guardarHistorialTrabajo(item){
  let historial = JSON.parse(localStorage.getItem("historialTrabajo")) || [];
  
  let unMesAtras = new Date().getTime() - (30 * 24 * 60 * 60 * 1000);
  historial = historial.filter(x => (x.timestamp || 0) >= unMesAtras);

  historial.push(item);
  localStorage.setItem("historialTrabajo", JSON.stringify(historial));
}

function calcularFechaFinAutomatica(){
  if(usuarioModificoFin) return;

  let fInicio = document.getElementById("trabajoFechaInicio").value;
  let hInicio = document.getElementById("trabajoHoraInicio").value;

  if(!fInicio || !hInicio) return;

  let fechaHoraStr = `${fInicio}T${hInicio}`;
  let fechaObj = new Date(fechaHoraStr);

  if(!isNaN(fechaObj.getTime())){
    fechaObj.setHours(fechaObj.getHours() + 12);

    let anio = fechaObj.getFullYear();
    let mes = String(fechaObj.getMonth() + 1).padStart(2, '0');
    let dia = String(fechaObj.getDate()).padStart(2, '0');
    let horas = String(fechaObj.getHours()).padStart(2, '0');
    let minutos = String(fechaObj.getMinutes()).padStart(2, '0');

    document.getElementById("trabajoFechaFin").value = `${anio}-${mes}-${dia}`;
    document.getElementById("trabajoHoraFin").value = `${horas}:${minutos}`;
  }
}

function generarTrabajoDiario(){
  let fInicio = document.getElementById("trabajoFechaInicio").value;
  let hInicio = document.getElementById("trabajoHoraInicio").value || "00:00";
  let fFin = document.getElementById("trabajoFechaFin").value;
  let hFin = document.getElementById("trabajoHoraFin").value || "23:59";

  if(!fInicio || !fFin){
    alert("POR FAVOR SELECCIONE LAS FECHAS");
    return;
  }

  let dtInicio = new Date(fInicio + "T" + hInicio);
  let dtFin = new Date(fFin + "T" + hFin);

  let historial = JSON.parse(localStorage.getItem("historialTrabajo")) || [];
  
  let unMesAtras = new Date().getTime() - (30 * 24 * 60 * 60 * 1000);
  historial = historial.filter(x => (x.timestamp || 0) >= unMesAtras);

  let filtrados = historial.filter(item => {
    let t = item.timestamp || 0;
    if(!t && item.fecha){
      t = new Date(item.fecha + "T" + (item.hora || "00:00")).getTime();
    }
    return t >= dtInicio.getTime() && t <= dtFin.getTime();
  });

  let listaTexto = "";
  let sumaDrogas = {}; 
  let sumaAprehensions = {}; 

  let idxInc = 1;
  let idxApr = 1;

  filtrados.forEach(item => {
    let fechaItem = (item.fecha || "").trim();
    let horaItem = (item.hora || "").trim();
    let lugarHecho = (item.lugar || "").trim();
    let oficialNombre = (item.oficialActuante || "").trim();

    if(item.tipoReg == "INCIDENTE"){
      let drogaName = (item.droga || "DROGA").trim();
      let cantStr = (item.cantidad || "0").trim();
      
      let matchNum = cantStr.match(/\d+/);
      let numVal = matchNum ? parseInt(matchNum[0]) : 1;
      let unidadMedida = cantStr.replace(/\d+/g, "").trim() || "";

      if(!sumaDrogas[drogaName]) sumaDrogas[drogaName] = { total: 0, unidades: new Set() };
      sumaDrogas[drogaName].total += numVal;
      if(unidadMedida) sumaDrogas[drogaName].unidades.add(unidadMedida);

      listaTexto += `${String(idxInc).padStart(2,'0')} - ${fechaItem} ${horaItem} - LUGAR: ${lugarHecho} - ${cantStr} DE ${drogaName}. OFICIAL ACTUANTE: ${oficialNombre}\n`;
      idxInc++;
    } else if(item.tipoReg == "APREHENSION"){
      let tCaptura = (item.tipoPlantilla || "CAPTURA").trim();
      let delitoStr = (item.delito || "SIN DELITO").trim();

      let claveAparato = `${tCaptura} - ${delitoStr}`;
      sumaAprehensions[claveAparato] = (sumaAprehensions[claveAparato] || 0) + 1;

      listaTexto += `${String(idxApr).padStart(2,'0')} - ${fechaItem} ${horaItem} - LUGAR: ${lugarHecho} - TIPO: ${tCaptura} - DELITO: ${delitoStr}. OFICIAL ACTUANTE: ${oficialNombre}\n`;
      idxApr++;
    }
  });

  if(listaTexto == "") listaTexto = "NO HAY REGISTROS EN ESTE RANGO HORARIO.";

  let sumaTexto = "";
  let haySuma = false;

  for(let d in sumaDrogas){
    let info = sumaDrogas[d];
    let unidadesStr = Array.from(info.unidades).join(" ");
    sumaTexto += `${String(info.total).padStart(2,'0')} ${unidadesStr} DE ${d}\n`;
    haySuma = true;
  }

  for(let a in sumaAprehensions){
    let count = sumaAprehensions[a];
    sumaTexto += `${String(count).padStart(2,'0')} ${a}\n`;
    haySuma = true;
  }

  if(!haySuma) sumaTexto += "SIN TOTALES QUE MOSTRAR.";

  document.getElementById("trabajoDetalleLista").value = listaTexto.toUpperCase();
  document.getElementById("trabajoDetalleSuma").value = sumaTexto.toUpperCase();
}

function construirListaCompletaForms(campos){
  let html = "";

  campos.forEach((campo, i) => {
    let entrada = "";
    if(campo=="NACIONALIDAD"){
      let opcionesNac = `<option>SELECCIONAR</option>`;
      nacionalidadesBase.forEach(n => {
        let nUp = (n || "");
        opcionesNac += `<option value="${nUp}">${nUp}</option>`;
      });
      entrada=`
        <div class="nacionalidad">
          <input id="datoForms${i}">
          <select onchange="document.getElementById('datoForms${i}').value=this.value">
            ${opcionesNac}
          </select>
        </div>
      `;
    }else if(campo=="DESCRIPCIÓN DE HECHOS"){
      entrada=`<textarea id="datoForms${i}"></textarea>`;
    }else if(campo=="GRUPO"){
      let opcionesGrupo = `<option>SELECCIONAR</option>`;
      grupos.forEach(g => {
        let gUp = (g || "");
        opcionesGrupo += `<option value="${gUp}">${gUp}</option>`;
      });
      entrada=`
        <div class="nacionalidad">
          <input id="datoForms${i}">
          <select onchange="document.getElementById('datoForms${i}').value=this.value">
            ${opcionesGrupo}
          </select>
        </div>
      `;
    }else{
      entrada=`<input id="datoForms${i}">`;
    }

    html+=`
      <div class="campo">
        <label>${campo}</label>
        ${entrada}
        <div class="botones">
          <button class="btn-copiar" onclick="copiarFormsSilencioso(${i})">COPIAR</button>
        </div>
      </div>
    `;
  });

  document.getElementById("listaForms").innerHTML = html;

  if(document.getElementById("tituloForms").innerHTML.includes("INCIDENTE")){
    llenarDatosFormIncidente();
  } else {
    llenarDatosFormAprehension();
  }
}

function copiarFormsSilencioso(id){
  let dato=document.getElementById("datoForms"+id);
  if(dato){
    dato.select();
    dato.setSelectionRange(0, 99999);
    navigator.clipboard.writeText(dato.value);
  }
}

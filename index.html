function cargarDatos(){

// ================= CREAR LISTAS =================



function crearLista(id,datos,campo){


let lista=document.getElementById(id);


if(!lista)return;


lista.innerHTML="";



let inicio=document.createElement("div");


inicio.innerHTML="Seleccionar";


inicio.onclick=function(){


document.getElementById(campo).value="";


lista.style.display="none";


};


lista.appendChild(inicio);




datos.forEach(function(valor){



let item=document.createElement("div");



let texto=


typeof valor==="object"

?

valor.nombre

:

valor;



item.innerHTML=texto;



item.onclick=function(){


document.getElementById(campo).value=texto;


lista.style.display="none";


};



lista.appendChild(item);


});



}

function buscarLugar(lat,lon,campo){



let consulta=`

[out:json];

(

way(around:50,${lat},${lon})["highway"]["name"];

);

out tags;

`;




fetch(

"https://overpass-api.de/api/interpreter?data="+

encodeURIComponent(consulta)

)



.then(r=>r.json())


.then(data=>{



let avenida="";

let calle="";

let respaldo="";




data.elements.forEach(function(v){



let nombre=v.tags.name || "";



if(nombre=="")return;



if(respaldo=="") respaldo=nombre;



let av=nombre.match(/avenida\s*(\d+)/i);



if(av && avenida==""){



avenida="Avenida "+av[1];


}




let ca=nombre.match(/calle\s*(\d+)/i);



if(ca && calle==""){



calle="Calle "+ca[1];



}



});




let resultado="";



if(avenida!="")

resultado+=avenida;

else{

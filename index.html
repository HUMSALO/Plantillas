🧹 Limpiar plantilla

<script>

let oficiales=[];
let drogas=[];
let unidades=[];
let grupos=[];



window.onload=function(){

cargarDatos();

actualizarListas();

cargarFechaHora();

mostrarDrogas();

};




// CAMBIO DE PANTALLAS


function ocultarTodo(){

moduloDatos.style.display="none";
moduloDrogas.style.display="none";
moduloPlantilla.style.display="none";

}



function mostrarDatos(){

ocultarTodo();

moduloDatos.style.display="block";

}



function mostrarDrogas(){

ocultarTodo();

moduloDrogas.style.display="block";

}



function mostrarPlantilla(){

ocultarTodo();

moduloPlantilla.style.display="block";

cargarFechaHoraPlantilla();

}





// FECHA Y HORA


function cargarFechaHora(){

let ahora=new Date();


fecha.value =
ahora.getFullYear()+"-"+
String(ahora.getMonth()+1).padStart(2,"0")+"-"+
String(ahora.getDate()).padStart(2,"0");


hora.value =
String(ahora.getHours()).padStart(2,"0")+":"+
String(ahora.getMinutes()).padStart(2,"0");

}




function cargarFechaHoraPlantilla(){

let ahora=new Date();


fechaPlantilla.value =
ahora.getFullYear()+"-"+
String(ahora.getMonth()+1).padStart(2,"0")+"-"+
String(ahora.getDate()).padStart(2,"0");


horaPlantilla.value =
String(ahora.getHours()).padStart(2,"0")+":"+
String(ahora.getMinutes()).padStart(2,"0");

}





// LISTAS


function llenarSelect(id,datos){

let lista=document.getElementById(id);


lista.innerHTML='<option value="">Seleccione</option>';



datos.forEach(function(valor){

let op=document.createElement("option");

op.value=valor;

op.text=valor;

lista.add(op);

});


}






function actualizarListas(){


llenarSelect("oficialActuante",oficiales);

llenarSelect("oficialAsistente",oficiales);

llenarSelect("plantillaActuante",oficiales);

llenarSelect("plantillaAsistente",oficiales);


llenarSelect("droga",drogas);


llenarSelect("unidad",unidades);


llenarSelect("grupo",grupos);



llenarSelect("listaOficiales",oficiales);

llenarSelect("listaDrogas",drogas);

llenarSelect("listaUnidades",unidades);

llenarSelect("listaGrupo",grupos);


}






// GUARDAR


function guardarDatos(){

localStorage.setItem(
"oficiales",
JSON.stringify(oficiales)
);


localStorage.setItem(
"drogas",
JSON.stringify(drogas)
);


localStorage.setItem(
"unidades",
JSON.stringify(unidades)
);


localStorage.setItem(
"grupos",
JSON.stringify(grupos)
);


}






// CARGAR


function cargarDatos(){


oficiales=
JSON.parse(localStorage.getItem("oficiales")) || [];


drogas=
JSON.parse(localStorage.getItem("drogas")) || [];


unidades=
JSON.parse(localStorage.getItem("unidades")) || [];


grupos=
JSON.parse(localStorage.getItem("grupos")) || [];




let drogasBase=[

"Marihuana",
"Cocaina",
"Crack",
"Tusi",
"Extasis",
"Wax"

];



drogasBase.forEach(function(d){

if(!drogas.includes(d)){

drogas.push(d);

}

});


guardarDatos();


}
  // ================= OFICIALES =================


function agregarOficial(){

let dato=nuevoOficial.value.trim();


if(dato!=""){

oficiales.push(dato);

guardarDatos();

actualizarListas();

nuevoOficial.value="";

}

}



function borrarOficial(){

let dato=listaOficiales.value;


if(dato!=""){

oficiales.splice(
oficiales.indexOf(dato),
1
);

guardarDatos();

actualizarListas();

listaOficiales.selectedIndex=0;

}

}






// ================= DROGAS =================


function agregarDroga(){

let dato=nuevaDroga.value.trim();


if(dato!=""){

drogas.push(dato);

guardarDatos();

actualizarListas();

nuevaDroga.value="";

}

}



function borrarDroga(){

let dato=listaDrogas.value;


if(dato!=""){

drogas.splice(
drogas.indexOf(dato),
1
);

guardarDatos();

actualizarListas();

listaDrogas.selectedIndex=0;

}

}






// ================= UNIDADES =================


function agregarUnidad(){

let dato=nuevaUnidad.value.trim();


if(dato!=""){

unidades.push(dato);

guardarDatos();

actualizarListas();

nuevaUnidad.value="";

}

}



function borrarUnidad(){

if(dato!=""){

// ================= GRUPO =================

guardarDatos();

actualizarListas();

nuevoGrupo.value="";

}

function borrarGrupo(){

let dato=listaGrupo.value;


if(dato!=""){

grupos.splice(
grupos.indexOf(dato),
1
);

guardarDatos();

actualizarListas();

listaGrupo.selectedIndex=0;

// ================= GPS =================


function obtenerGPS(){


if(!navigator.geolocation){

alert("GPS no disponible");

return;

}


navigator.geolocation.getCurrentPosition(function(pos){


buscarLugar(
pos.coords.latitude,
pos.coords.longitude,
"lugar"
);


});


}




function obtenerGPSPlantilla(){


if(!navigator.geolocation){

alert("GPS no disponible");

return;

}


navigator.geolocation.getCurrentPosition(function(pos){


buscarLugar(
pos.coords.latitude,
pos.coords.longitude,
"lugarPlantilla"
);


});


}







function buscarLugar(lat,lon,campo){

let consulta=`
[out:json];
(
way(around:50,${lat},${lon})["highway"]["name"];
);
out tags;
`;

fetch(
"https://overpass-api.de/api/interpreter?data="+
encodeURIComponent(consulta)
)

.then(r=>r.json())

.then(data=>{

let avenida="";
let calle="";
let respaldo="";

data.elements.forEach(function(v){

let nombre=v.tags.name || "";

if(nombre=="") return;

if(respaldo=="") respaldo=nombre;


// Busca Avenida 24
let av=nombre.match(/avenida\s*(\d+)/i);

if(av && avenida==""){

avenida="Avenida "+av[1];

}


// Busca Calle 9
let ca=nombre.match(/calle\s*(\d+)/i);

if(ca && calle==""){

calle="Calle "+ca[1];

}

});

let resultado="";

if(avenida!="") resultado+=avenida;

if(calle!=""){

if(resultado!="") resultado+=" ";

resultado+=calle;

}

if(resultado==""){

resultado=respaldo || "Sin referencia";

}

document.getElementById(campo).value=resultado;

})

.catch(function(){

document.getElementById(campo).value="Sin referencia";

});

}







// ================= LISTA O ESCRITURA =================



function obtenerValor(lista,manual){


if(manual.value.trim()!=""){


return manual.value.trim();


}


return lista.value;


}
  
// ================= WHATSAPP DROGAS =================


function enviarWhatsApp(){


let drogaFinal=
obtenerValor(droga,drogaManual);


let actuanteFinal=
obtenerValor(oficialActuante,actuanteManual);


let asistenteFinal=
obtenerValor(oficialAsistente,asistenteManual);



let mensaje=

`*REGISTRO DE DROGAS*

📆 *FECHA:* ${fecha.value}
⏰ *HORA:* ${hora.value}
📍 *LUGAR:* ${lugar.value}
🧪 *TIPO DE DROGA:* ${drogaFinal}
⚖️ *CANTIDAD:* ${cantidad.value}
👥 *NOMBRE IMPUTADO:* ${nombre.value}
🪪 *CÉDULA:* ${cedula.value}
👮 *OFICIAL ACTUANTE:* ${actuanteFinal}
👮 *OFICIAL ASISTENTE:* ${asistenteFinal}`;



window.location.href=

"https://api.whatsapp.com/send?text="+

encodeURIComponent(mensaje);


}







// ================= WHATSAPP PLANTILLA =================



function enviarPlantilla(){


let tipoFinal=
obtenerValor(tipoPlantilla,tipoManual);


let juzgadoFinal=
obtenerValor(juzgado,juzgadoManual);


let actuanteFinal=
obtenerValor(plantillaActuante,plantillaActuanteManual);


let asistenteFinal=
obtenerValor(plantillaAsistente,plantillaAsistenteManual);


let unidadFinal=
obtenerValor(unidad,unidadManual);


let grupoFinal=
obtenerValor(grupo,grupoManual);




let mensaje=

`*PLANTILLA APREHENSIONES*

*TIPO:* ${tipoFinal}
📆 *FECHA:* ${fechaPlantilla.value}
⏰ *HORA:* ${horaPlantilla.value}
*CANTÓN:* ${canton.value}
*DISTRITO:* ${distrito.value}
📍 *LUGAR EXACTO:* ${lugarPlantilla.value}
👥 *NOMBRE IMPUTADO:* ${nombrePlantilla.value}
🪪 *CÉDULA:* ${cedulaPlantilla.value}
*TIPO DELITO:* ${delitoPlantilla.value}`;



if(expediente.value.trim()!=""){

mensaje+=`

*EXPEDIENTE:* ${expediente.value}`;

}



if(juzgadoFinal!=""){

mensaje+=`

*JUZGADO:* ${juzgadoFinal}`;

}



mensaje+=`

*DILIGENCIAS:*
${diligencias.value}`;



if(actuanteFinal!=""){

mensaje+=`

👮 *OFICIAL ACTUANTE:* ${actuanteFinal}`;

}



if(asistenteFinal!=""){

mensaje+=`

👮 *OFICIAL ASISTENTE:* ${asistenteFinal}`;

}



if(asesor.value.trim()!=""){

mensaje+=`

🤵🏻‍♂ *ASESOR LEGAL:* ${asesor.value}`;

}



if(unidadFinal!=""){

mensaje+=`

🚔 *UNIDAD:* ${unidadFinal}`;

}



if(grupoFinal!=""){

mensaje+=`

👥 *GRUPO:* ${grupoFinal}`;

}




window.location.href=

"https://api.whatsapp.com/send?text="+

encodeURIComponent(mensaje);


}








// ================= LIMPIAR DROGAS =================


function limpiar(){


lugar.value="";

cantidad.value="";

nombre.value="";

cedula.value="";


droga.selectedIndex=0;

drogaManual.value="";


oficialActuante.selectedIndex=0;

plantillaActuanteManual.value="";

</script>
